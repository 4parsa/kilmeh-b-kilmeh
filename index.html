<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كلمة بكلمة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <header class="site-header">
    <h1 lang="ar" dir="rtl">كلمة بكلمة</h1>
  </header>

  <nav class="site-nav">
    <a href="lesson.html" id="lesson-link" class="nav-btn">Lesson Mode</a>
      <a href="flashcards.html" class="nav-btn">Flashcards</a>
    <button id="open-add" class="nav-btn">Add word</button>
  </nav>

  <main>
    <input id="search" type="search" placeholder="Search…">

    <div id="tabs" class="tabs">
      <button class="tab active" data-tab="words">Words</button>
      <button class="tab" data-tab="phrases">Phrases</button>
      <button class="tab" data-tab="sentences">Sentences</button>
    </div>

    <div id="filters" class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="noun">Nouns</button>
      <button class="filter" data-filter="verb">Verbs</button>
      <button class="filter" data-filter="adjective">Adjectives</button>
      <button class="filter" data-filter="other">Other</button>
    </div>

    <div id="word-list"></div>
  </main>

  <dialog id="word-dialog">
    <form id="add-form">
      <h2 id="dialog-title">Add word</h2>
      <input id="english" placeholder="English" required>
      <input id="arabic" placeholder="Arabic" lang="ar" dir="rtl" required>
      <input id="translit" placeholder="Transliteration" required>
      <select id="type">
        <option value="noun">Noun</option>
        <option value="verb">Verb</option>
        <option value="adjective">Adjective</option>
        <option value="adverb">Adverb</option>
        <option value="preposition">Preposition</option>
        <option value="pronoun">Pronoun</option>
        <option value="number">Number</option>
        <option value="question">Question word</option>
        <option value="conjunction">Conjunction</option>
        <option value="phrase">Phrase</option>
        <option value="sentence">Sentence</option>
      </select>

      <div id="extra-fields"></div>

      <textarea id="notes" placeholder="Notes (optional)"></textarea>

      <div class="dialog-buttons">
        <button type="button" id="cancel-edit">Cancel</button>
        <button type="submit" id="submit-btn">Add word</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js?v=7"></script>
  <script src="js/shared.js?v=3"></script>
  <script src="js/dictionary.js?v=4"></script>
</body>
</html>
